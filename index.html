<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Кликер</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<p class="push d-n">Ты в деле!</p>
		<div class="clicker">
			<h1>Кликер «Клак»</h1>
			<div class="clicker__body">
				<p class="clicker__count">0</p>
				<div class="clicker__btns">
					<button class="clicker__btn">Кликнуть</button>
					<button class="clicker__up" disabled>
						Улучшение<br />
						(<span>50</span> очков)
					</button>
				</div>
				<div class="clicker__stats">
					<p class="clicker__clicks">Кликов сделано: <span>0</span></p>
					<p class="clicker__clickForce">Сила клика: <span>1</span></p>
				</div>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
